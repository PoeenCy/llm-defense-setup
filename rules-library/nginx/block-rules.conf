# ─────────────────────────────────────────────────────────────────────────────
# Rule CHẶN cấp nginx — dùng khi KHÔNG cài được ctf_proxy.
# Dán các khối dưới vào trong `server { ... }` của nginx public-proxy trên vulnbox
# (container đội bạn — bạn được sửa), rồi:  nginx -t && nginx -s reload
#
# QUAN TRỌNG — chặn theo NỘI DUNG, không theo User-Agent/IP:
#   * KHÔNG chặn theo User-Agent: checker có thể đặt UA giống trình duyệt / đổi UA,
#     chặn nhầm là mất SLA. UA chỉ dùng để ALERT (Suricata), không để chặn.
#   * KHÔNG chặn theo IP ở đây: checker và attacker có thể ra cùng dải NAT.
#   nginx thường (không có lua) chỉ xem được URL/tham số/header, KHÔNG xem kỹ body POST.
#   Vì vậy đây là lớp chặn các đòn nằm trên URL/query. Đòn trong body POST -> cần ctf_proxy.
#
# Mỗi khối trả 403 khi khớp. Bật từng khối một, TEST (gọi thử endpoint hợp lệ của
# checker còn 200 không) rồi mới thêm khối tiếp. Dòng nào nghi chặn nhầm thì xoá.
# $request_uri và $args đã là bản giải mã nginx thấy; thêm $args để bắt query.
# ─────────────────────────────────────────────────────────────────────────────

# 1) Path traversal / LFI
if ($request_uri ~* "(\.\./|\.\.%2f|%2e%2e/|/etc/passwd|/proc/self/|%00)") { return 403; }

# 2) SQL injection trên URL/query
if ($args ~* "(union(\s|\+|/\*.*\*/)+select|\bor\b\s+1\s*=\s*1|information_schema|sqlite_master|\bsleep\s*\(|\bbenchmark\s*\(|\bwaitfor\s+delay)") { return 403; }

# 3) OS command injection trên URL/query (dấu nối shell + lệnh)
if ($args ~* "(;|\||%3b|%7c|`|%60|\$\()\s*(id|cat|ls|nc|curl|wget|bash|sh|python|whoami|uname)\b") { return 403; }
if ($args ~* "(/dev/tcp/|/bin/sh\b|\bnc\s+-e\b|mkfifo)") { return 403; }

# 4) SSTI trên URL/query
if ($args ~* "(\{\{.*(\(|__).*\}\}|\$\{.*\}|__class__|__globals__|__subclasses__)") { return 403; }

# 5) SSRF trên URL/query
if ($args ~* "(https?://(127\.|localhost|0\.0\.0\.0|169\.254\.169\.254)|(file|gopher|dict|php|jar|phar)://|metadata\.google\.internal)") { return 403; }

# 6) Webshell gọi lệnh qua tham số (?cmd= / ?exec= trên file script)
if ($request_uri ~* "\.(php[0-9]?|phtml|jsp|aspx?|cgi)\?.*\b(cmd|exec|command|shell|run)=") { return 403; }

# 7) NoSQL injection (operator trên query)
if ($args ~* "(\[\$(ne|gt|gte|lt|lte|regex|where|in|nin)\]|%24(ne|gt|where))") { return 403; }

# 8) LDAP injection
if ($args ~* "(\*\)\s*\(|\)\s*\(\s*\w+=\*)") { return 403; }

# Ghi chú: để chặn đòn trong BODY POST (upload webshell, SSTI/SQLi trong form/JSON),
# dùng ctf_proxy (filter Python xem được body) — nginx thường không làm tốt việc này.
